name: RMS Full-Stack CI Pipeline

on:
  push:
    branches: [ develop, main, master ]
  pull_request:
    branches: [ develop, main, master ]

jobs:
  backend-test:
    name: Backend Build & xUnit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore backend/RMS.Backend.sln

    - name: Build Solution
      run: dotnet build backend/RMS.Backend.sln --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test backend/RMS.Backend.sln --no-build --configuration Release --verbosity normal

  ai-agent-test:
    name: LangGraph Agent Pytest Suite
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install AI Dependencies
      run: |
        cd ai-agent
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Run Agentic Pytest Suite
      run: |
        cd ai-agent
        pytest -v

  frontend-build:
    name: React 19 Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: |
        cd frontend
        npm ci

    - name: Build Production Bundle
      run: |
        cd frontend
        npm run build
